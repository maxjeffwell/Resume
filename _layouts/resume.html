<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  
  <style>
    /* Professional Resume CSS for Jekyll */
    
    /* Base Typography */
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 11pt;
        line-height: 1.5;
        color: #2d3748;
        max-width: 8.5in;
        margin: 0 auto;
        padding: 0.5in;
        background: white;
    }
    
    /* Headings */
    h1 {
        font-size: 28pt;
        font-weight: 700;
        text-align: center;
        margin: 0 0 5px 0;
        color: #1a202c;
        letter-spacing: 1px;
        text-transform: uppercase;
    }
    
    h2 {
        font-size: 13pt;
        font-weight: 700;
        color: #2b6cb0;
        margin: 20px 0 10px 0;
        padding-bottom: 5px;
        border-bottom: 2px solid #e2e8f0;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    h3 {
        font-size: 12pt;
        font-weight: 600;
        color: #2d3748;
        margin: 15px 0 8px 0;
    }
    
    /* Links */
    a {
        color: #2b6cb0;
        text-decoration: none;
        font-weight: 500;
    }
    
    a:hover {
        text-decoration: underline;
    }
    
    /* Contact Info Header */
    .contact-info {
        text-align: center;
        margin-bottom: 20px;
        color: #666;
        font-size: 14px;
    }
    
    /* Professional Summary */
    .summary {
        background: #f7fafc;
        padding: 12px;
        border-radius: 5px;
        margin: 15px 0;
    }
    
    /* Skills Section - Code Blocks */
    code {
        background: #e2e8f0;
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 10pt;
        font-family: 'SF Mono', Monaco, 'Courier New', monospace;
        color: #2d3748;
        white-space: nowrap;
    }
    
    /* Project Sections */
    .project {
        border-left: 3px solid #cbd5e0;
        padding-left: 15px;
        margin-bottom: 20px;
    }
    
    /* Bullet Points */
    ul {
        margin: 8px 0;
        padding-left: 20px;
    }
    
    li {
        margin: 4px 0;
        line-height: 1.4;
    }
    
    /* Strong emphasis */
    strong {
        font-weight: 600;
        color: #1a202c;
    }
    
    /* Horizontal Rules */
    hr {
        border: none;
        border-top: 1px solid #e2e8f0;
        margin: 20px 0;
    }
    
    /* Metrics Grid */
    .metrics {
        display: flex;
        justify-content: space-around;
        margin: 20px 0;
        padding: 15px;
        background: #f7fafc;
        border-radius: 8px;
    }
    
    .metrics > div {
        text-align: center;
        flex: 1;
    }
    
    .metrics > div > strong {
        display: block;
        font-size: 18pt;
        color: #2b6cb0;
        margin-bottom: 3px;
    }
    
    /* What I Bring Section */
    .highlight-section {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 15px;
        border-radius: 8px;
        margin: 20px 0;
    }
    
    .highlight-section * {
        color: white;
    }
    
    /* Two-column layout */
    .two-columns {
        display: flex;
        justify-content: space-between;
        gap: 20px;
    }
    
    .two-columns > div {
        width: 48%;
    }
    
    /* Print Specific */
    @media print {
        body {
            font-size: 10pt;
            padding: 0;
            margin: 0;
        }
        
        h1 {
            font-size: 24pt;
        }
        
        h2 {
            font-size: 12pt;
            margin-top: 15px;
        }
        
        h3 {
            font-size: 11pt;
        }
        
        @page {
            margin: 0.5in;
        }
        
        h2:first-of-type {
            page-break-after: avoid;
        }
    }
    
    /* Responsive */
    @media screen and (max-width: 500px) {
        body {
            padding: 20px;
        }
        
        .two-columns {
            flex-direction: column;
        }
        
        .two-columns > div {
            width: 100%;
        }
        
        .metrics {
            flex-direction: column;
            gap: 10px;
        }
    }
  </style>
</head>
<body>
  {{ content }}
</body>
</html>
