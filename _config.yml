title: Jeffrey R. Maxwell - Resume
description: Full-Stack Developer Resume
url: "https://maxjeffwell.github.io"
baseurl: "/Resume"

markdown: kramdown
highlighter: rouge
theme: jekyll-theme-cayman

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - node_modules/
  - "*.pdf"
  - "*.sh"