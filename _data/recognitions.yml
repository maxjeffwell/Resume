# Academic Honors & Recognition
- award: Phi Beta Kappa Society
  organization: Trinity College
  year: 2017
  summary: Elected to the oldest academic honor society in the United States for academic excellence and intellectual engagement.

- award: Summa Cum Laude Graduate
  organization: Trinity College  
  year: 2017
  summary: Highest distinction awarded to top 5% of graduating class with GPA of 3.91.

- award: President's Fellow
  organization: Trinity College
  year: 2016-2017
  summary: Selected from entire student body for leadership and academic achievement. Met bi-weekly with college president to discuss campus initiatives and co-edited Trinity Papers, annual journal of outstanding undergraduate scholarship.

- award: Writing Center Associate
  organization: Trinity College
  year: 2015-2017
  summary: Faculty-recommended position as specialized bilingual writing advisor. Collaborated with students on academic writing in English and Spanish and developed workshops on cross-cultural communication.