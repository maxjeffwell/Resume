# Site settings
title: "Jeffrey R. Maxwell - Full-Stack Developer"
description: "Self-motivated full-stack developer with demonstrated ability to independently master modern web technologies through intensive self-directed learning and immersive bootcamp training. Successfully built and deployed 6+ production-ready applications using React, Node.js, GraphQL, and cloud platforms."
url: "https://maxjeffwell.github.io"
baseurl: "/Resume"

# Build settings
markdown: kramdown

# Architect theme
remote_theme: pages-themes/architect@v0.2.0

# Jekyll plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-remote-theme

kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - node_modules/
  - "*.pdf"
  - "*.sh"